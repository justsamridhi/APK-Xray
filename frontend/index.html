<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="APK X-ray evidence-first Android static security analyzer" />
    <!-- UX4G Design System Library (Government of India / NeGD standard) -->
    <link rel="stylesheet" href="https://cdn.ux4g.gov.in/UX4G@3.0.18/index.css" />
    <!-- Indic Typography for Multilingual Devanagari Support -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>APK X-ray</title>
  </head>
  <body>
    <script>
      (() => {
        try {
          const saved = localStorage.getItem('apk-xray-theme');
          const preferred = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.dataset.theme = saved === 'dark' || saved === 'light' ? saved : preferred;
        } catch {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
